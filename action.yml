name: 'Lunaria Claim'
description: >-
  Manage translation claim issues driven by Lunaria status.json:
  claim recognition with reactions, TTL expiry release, and PR linking.
author: 'lunaria-claim contributors'
branding:
  icon: 'check-square'
  color: 'blue'

inputs:
  mode:
    description: 'Which mode to run: sync | claim | expire | link-pr | view-edit'
    required: true
  token:
    description: 'GitHub token used for API calls'
    default: ${{ github.token }}
  status-json:
    description: 'Path to the status.json produced by `lunaria build` (sync mode only)'
    default: './dist/lunaria/status.json'
  config-path:
    description: 'Path to the lunaria-claim.yml config file'
    default: '.github/lunaria-claim.yml'
  dry-run:
    description: >-
      sync: render and report to the step summary without writing anything
      (useful to validate a template before real runs)
    default: 'false'

outputs:
  issue-url:
    description: 'URL of the tracker issue (sync mode)'

runs:
  using: 'node24'
  main: 'main.cjs'
