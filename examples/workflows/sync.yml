name: Translation tracker sync
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lunaria-claim-sync

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Lunaria 需要完整 git 历史
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lunaria:build
      - uses: jiazengp/lunaria-claim@v1
        with:
          mode: sync
          # 与消费端 lunaria.config.json 的 outDir 对应，status.json 就在其下
          status-json: ./dist/lunaria/status.json
